apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-srv
  annotations: 
    nginx.ingress.kubernetes.io/use-regex: 'true'
  labels:
    app.kubernetes.io/name: ingress-srv
spec:
  rules:
  - host: posts.com
    http:
      paths:
      - pathType: Prefix
        path: "/posts/create"
        backend:
          service:
            name: posts-clusterip-srv
            port: 
              number: 4000

      - pathType: Prefix
        path: "/posts"
        backend:
          service:
            name: query-clusterip-srv
            port:
              number: 4002

      - pathType: ImplementationSpecific
        path: "/posts/?(.*)/comments"
        backend:
          service:
            name: comments-clusterip-srv
            port:
              number: 4001

      - pathType: ImplementationSpecific
        path: "/?(.*)"
        backend:
          service:
            name: client-clusterip-srv 
            port:
              number: 3000

